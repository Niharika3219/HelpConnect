<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - HelpConnect</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header>
        <nav>

            <div class="logo">
                Help<span>Connect</span>
            </div>

            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/login">Login</a>
            </div>

        </nav>
    </header>


    <main class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p>Join HelpConnect and start helping your community.</p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </main>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
