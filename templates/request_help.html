<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ask for Help - HelpConnect</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Navigation -->
<header class="navbar">

    <div class="navbar-inner">

        <a href="{{ url_for('home') }}" class="logo">
            Help<span>Connect</span>
        </a>

        <nav class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('requests_page') }}">
                Requests
            </a>

            {% if session.get("user_id") %}

                <a href="{{ url_for('request_help') }}">
                    Ask for Help
                </a>

                <a href="{{ url_for('offers') }}">
                    My Offers
                </a>

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a
                    href="{{ url_for('logout') }}"
                    class="nav-logout"
                >
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a
                    href="{{ url_for('register') }}"
                    class="nav-register"
                >
                    Register
                </a>

            {% endif %}

        </nav>

    </div>

</header>

    <!-- Help Request Form -->

    <main class="form-container">

        <div class="form-card">

            <h1>Ask for Help</h1>

            <p>
                Tell the community what you need help with.
            </p>


            <form id="helpRequestForm">

                <!-- Title -->

                <label for="title">
                    What do you need help with?
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: Need help moving furniture"
                    required
                >


                <!-- Description -->

                <label for="description">
                    Describe your request
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Explain what kind of help you need..."
                    required
                ></textarea>


                <!-- Category -->

                <label for="category">
                    Category
                </label>

                <select id="category" name="category" required>

                    <option value="">
                        Select a category
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Technology">
                        Technology
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Household">
                        Household
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <!-- Location -->

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Example: College campus"
                    required
                >


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Post Help Request
                </button>

            </form>

            <p id="requestMessage"></p>

        </div>

    </main>


    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

</body>

</html>
